name: checkov

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build image
      run: docker image build -t nginxinc/nginx-unprivileged:alpine3.22-perl .
    - name: Run Checkov vulnerability scanner for the backend
      run: checkov -f ../../backend/Dockerfile
    - name: Run Checkov vulnerability scanner for the frontend
      run: checkov -f ../../frontend/Dockerfile
